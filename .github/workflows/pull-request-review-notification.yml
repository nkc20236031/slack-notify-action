name: Notify Slack - PR Review

on:
  workflow_call:
    inputs:
      pr_title:
        required: true
        type: string
      pr_url:
        required: true
        type: string
      pr_number:
        required: true
        type: number
      reviewer_github:
        required: true
        type: string
      reviewee_github:
        required: true
        type: string
      review_state:
        required: true
        type: string
      review_body:
        required: false
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        required: true
      SLACK_USER_MAP_JSON:
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Set datetime
        run: |
          export TZ=Asia/Tokyo
          echo "date_time=$(date '+%Y-%m-%d %H:%M:%S JST')" >> $GITHUB_ENV

      - name: Convert GitHub users to Slack mentions
        run: |
          map_json='${{ secrets.SLACK_USER_MAP_JSON }}'
          
          if [ -z "$map_json" ]; then
            echo "{}" > usermap.json
          else
            echo "$map_json" > usermap.json || echo "{}" > usermap.json
          fi

          reviewer=$(jq -r --arg u "${{ inputs.reviewer_github }}" 'if type == "object" then .[$u] // empty else empty end' usermap.json)
          reviewee=$(jq -r --arg u "${{ inputs.reviewee_github }}" 'if type == "object" then .[$u] // empty else empty end' usermap.json)

          if [ -n "$reviewer" ] && [ "$reviewer" != "null" ]; then
            echo "reviewer_slack=<@$reviewer>" >> $GITHUB_ENV
          else
            echo "reviewer_slack=${{ inputs.reviewer_github }}" >> $GITHUB_ENV
          fi

          if [ -n "$reviewee" ] && [ "$reviewee" != "null" ]; then
            echo "reviewee_slack=<@$reviewee>" >> $GITHUB_ENV
          else
            echo "reviewee_slack=${{ inputs.reviewee_github }}" >> $GITHUB_ENV
          fi

      # 状態別にカラーと表示名を設定
      - name: Set review state style
        run: |
          state="${{ inputs.review_state }}"
          case "$state" in
            commented)
              echo "review_color=#ffffff" >> $GITHUB_ENV
              echo "review_label=⚪ commented" >> $GITHUB_ENV
              ;;
            approved)
              echo "review_color=#00ff00" >> $GITHUB_ENV
              echo "review_label=✅ approved" >> $GITHUB_ENV
              ;;
            changes_requested)
              echo "review_color=#ff0000" >> $GITHUB_ENV
              echo "review_label=❌ Request Changes" >> $GITHUB_ENV
              ;;
            *)
              echo "review_color=#dddddd" >> $GITHUB_ENV
              echo "review_label=$state" >> $GITHUB_ENV
              ;;
          esac

      - name: Build Slack payload (PR Review)
        run: |
          payload=$(jq -n \
            --arg title "${{ inputs.pr_title }}" \
            --arg pr_url "${{ inputs.pr_url }}" \
            --arg pr_number "${{ inputs.pr_number }}" \
            --arg reviewer "${{ env.reviewer_slack }}" \
            --arg reviewee "${{ env.reviewee_slack }}" \
            --arg state "${{ env.review_label }}" \
            --arg color "${{ env.review_color }}" \
            --arg body "${{ inputs.review_body || '' }}" \
            --arg date_time "${{ env.date_time }}" \
          '{
            attachments: [
              {
                color: $color,
                blocks: [
                  {
                    type: "header",
                    text: {
                      type: "plain_text",
                      text: "コードレビューが行われました"
                    }
                  },
                  {
                    type: "section",
                    fields: [
                      { type: "mrkdwn", text: "*レビュワー*" },
                      { type: "mrkdwn", text: "*レビュイー*" },
                      { type: "mrkdwn", text: $reviewer },
                      { type: "mrkdwn", text: $reviewee }
                    ]
                  },
                  {
                    type: "section",
                    fields: [
                      { type: "mrkdwn", text: "*状態*" },
                      { type: "mrkdwn", text: "*PR番号*" },
                      { type: "mrkdwn", text: $state },
                      { type: "mrkdwn", text: "<\($pr_url)|#\($pr_number)>" }
                    ]
                  },
                  {
                    type: "section",
                    text: {
                      type: "mrkdwn",
                      text: $body
                    }
                  },
                  {
                    type: "context",
                    elements: [
                      {
                        type: "mrkdwn",
                        text: ("作成日:" + $date_time)
                      }
                    ]
                  },
                  {
                    type: "actions",
                    elements: [
                      {
                        type: "button",
                        text: {
                          type: "plain_text",
                          text: "レビューコメントを開く",
                          emoji: true
                        },
                        url: ($pr_url + "#pullrequestreview"),
                        style: "primary"
                      }
                    ]
                  }
                ]
              }
            ]
          }')

          {
            echo "payload<<EOF"
            echo "$payload"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Send to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$SLACK_WEBHOOK_URL"
